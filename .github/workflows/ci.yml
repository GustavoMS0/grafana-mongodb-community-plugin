name: CI

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Typecheck & Build Frontend
        run: |
          npm run typecheck
          npm run build

      - name: Vet & Test Backend
        run: |
          go vet ./pkg/...
          go test -v -race ./pkg/...

      - name: Build Backend Binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/gpx_mongodb-community_linux_amd64 ./pkg
          GOOS=linux GOARCH=arm64 go build -o dist/gpx_mongodb-community_linux_arm64 ./pkg
          GOOS=darwin GOARCH=amd64 go build -o dist/gpx_mongodb-community_darwin_amd64 ./pkg
          GOOS=darwin GOARCH=arm64 go build -o dist/gpx_mongodb-community_darwin_arm64 ./pkg
          GOOS=windows GOARCH=amd64 go build -o dist/gpx_mongodb-community_windows_amd64.exe ./pkg

      - name: Package Plugin Archive
        run: zip -r meln5674-mongodb-community.zip dist/ CHANGELOG.md LICENSE README.md
